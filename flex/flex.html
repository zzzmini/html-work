<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>7강 Flexbox</title>
    <style>
      /* 아이템 모양 (공통) */
      .box {
        background-color: tomato;
        color: white;
        border: 1px solid white;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <!-- 아래 예제 HTML을 여기에 순서대로 붙이기 -->
    <h2>1-1. 가장 간단한 사용</h2>
    <div style="display: flex">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>
    <h2>1-2. 가운데 놓기</h2>
    <div
      style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        background-color: powderblue;
      "
    >
      <div class="box">1</div>
      <div class="box">2</div>
    </div>

    <h2>2-1. flex-grow 1 : 2</h2>
    <div style="display: flex; background-color: powderblue">
      <div class="box" style="flex-grow: 1">1 (글자가 긴 아이템입니다)</div>
      <div class="box" style="flex-grow: 2">2</div>
    </div>

    <h2>2-2. flex 1 : 2</h2>
    <div style="display: flex; background-color: powderblue">
      <div class="box" style="flex: 1">1 (글자가 긴 아이템입니다)</div>
      <div class="box" style="flex: 2">2</div>
    </div>
    <h2>3-1. flex-shrink 0 / 1</h2>
    <div style="display: flex; background-color: powderblue">
      <div class="box" style="flex-basis: 300px">1 (shrink 기본값 1)</div>
      <div class="box" style="flex-basis: 300px; flex-shrink: 0">
        2 (shrink 0)
      </div>
      <div class="box" style="flex-basis: 300px; flex-shrink: 1">
        3 (shrink 1)
      </div>
    </div>
    <h2>3-2. flex-shrink 1 : 2</h2>
    <div style="display: flex; background-color: powderblue">
      <div class="box" style="flex-basis: 300px; flex-shrink: 1">
        A (shrink 1)
      </div>
      <div class="box" style="flex-basis: 300px; flex-shrink: 2">
        B (shrink 2)
      </div>
    </div>
    <h2>실습① 상단 네비게이션 메뉴</h2>
    <div
      style="
        display: flex;
        align-items: center;
        padding: 10px;
        background-color: whitesmoke;
      "
    >
      <div>ShoesShop</div>
      <div style="flex-grow: 1"></div>
      <!-- 빈 공간으로 밀어내기 -->
      <div style="margin-right: 10px">Products</div>
      <div>Services</div>
    </div>
  </body>
</html>
