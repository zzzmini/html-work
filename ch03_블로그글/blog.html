<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/blog.css">
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <!-- 왼쪽 큰 영역 -->
      <div class="blog-content">
        <!-- 작성자정보 -->
        <div class="blog-header">
            <img src="./image/image.png" alt="프로필사진" class="profile-img">
            <div class="blog-name">
                <h4>김형민입니다</h4>
                <p>8시간 전</p>
            </div>
        </div>
        <!-- 글 제목 + 본문 -->
        <div class="blog-text">
            <h3>#손흥민_바나나_코너킥_결승골 #역시나다</h3>
            <p>'호러쇼' 포스터·'멍때린' 포스테코글루 모두 살린 손흥민의 코너킥 골…'진짜 결자해지는 이런 것' 이성필 기자 님의 스토리 · 1시간 · 3분 읽음 ▲ 토트넘 홋스퍼 주장 손흥민이 맨체스터 유나이티드와의  카라바오컵 8강에서 코너킥을 그대로 넣어 결승골을 만들었다. ⓒ연합뉴스/AFP/REUTERS ▲ 토트넘 홋스퍼 …</p>
        </div>
        <!-- 공감/댓글 -->
        <div class="blog-footer">
            <span>공감 12</span> &nbsp;
            <span>댓글 3</span>
        </div>
      </div>
      <!-- 오른쪽 썸네일 영역 영역 -->
      <div class="blog-img">
        <img src="./image/blog_img.jpg" alt="블로그썸네일" />
      </div>
    </div>
  </body>
</html>
