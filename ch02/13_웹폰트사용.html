<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gaegu&family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>
    p   { font-size: 28px; }
    .f1 { font-family: 'Noto Sans KR', sans-serif; }
    .f2 { font-family: 'Gaegu', cursive; }        /* 손글씨체 */
    .f3 { font-family: 'Do Hyeon', sans-serif; }  /* 두꺼운 제목체 */
    .f4 { font-family: 'Do Hyeon', sans-serif; letter-spacing: 4px; }  /* 자간(글자 사이 간격) 넓게 */
    .f5 { font-family: 'Jua', sans-serif; }              /* 둥글둥글 귀여운 제목체 */
    .f6 { font-family: 'Black Han Sans', sans-serif; }   /* 아주 굵은 강조체 */
    .f7 { font-family: 'Nanum Pen Script', cursive; }    /* 펜으로 쓴 손글씨 */
    .f8 { font-family: 'Gowun Dodum', sans-serif; }      /* 부드러운 본문체 */
</style>
  </head>
  <body>
    <p>기본 글꼴 : 오늘도 코딩 화이팅!</p>
    <p class="f1">Noto Sans KR : 오늘도 코딩 화이팅!</p>
    <p class="f2">Gaegu : 오늘도 코딩 화이팅!</p>
    <p class="f3">Do Hyeon : 오늘도 코딩 화이팅!</p>
    <p class="f4">Do Hyeon + 자간 4px : 오늘도 코딩 화이팅!</p>
    <p class="f5">Jua : 오늘도 코딩 화이팅!</p>
    <p class="f6">Black Han Sans : 오늘도 코딩 화이팅!</p>
    <p class="f7">Nanum Pen Script : 오늘도 코딩 화이팅!</p>
    <p class="f8">Gowun Dodum : 오늘도 코딩 화이팅!</p>
  </body>
</html>
