<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/01_apply_css.css">
    <title>Document</title>
    <!-- head 안의 style 태그 사용 -->
    <style>
        .mystyle { color: brown;}
        p {color: blue;}
    </style>
  </head>
  <body>
    <p style="color: red">
      스타일 지정 방법 1. 태그안에 직접 style 속성으로 적는법
    </p>
    <p class="mystyle">
        head 안에 style로 지정
    </p>
    <p class="css-file">파일로 분리하는 법</p>
  </body>
</html>
