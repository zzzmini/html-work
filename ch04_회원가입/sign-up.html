<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/sign-up.css" />
    <!-- defer : 아래의 html 을 모두 로딩한 후에
     자바스크립트를 실행하세요 -->
    <script defer src="./js/sign-up.js"></script>
    <title>회원가입</title>

  </head>
  <body>
    <div class="container">
      <h1>회원 가입을 환영합니다.</h1>
      <!-- 이벤트에 실행할 자바스크립트 함수를 연결한다. -->
      <form method="get" onsubmit="checkSign(event)">
        <fieldset>
          <legend>사용자정보</legend>
          <ul>
            <li>
              <label for="uid">아이디</label>
              <input
                type="text"
                id="uid"
                name="uid"
                required
                autofocus
                placeholder="4자~10자 사이, 공백없이"
              />
            </li>
            <li>
              <label for="email">이메일</label>
              <input type="email" id="email" name="email" />
            </li>
            <li>
              <label for="pwd">비밀번호</label>
              <input type="password" id="pwd" name="pwd" />
            </li>
            <li>
              <label for="confirm">비밀번호 확인</label>
              <input type="password" id="confirm" />
            </li>
            <li>
              <label for="path">가입경로</label>
              <!-- 서버로 전송 : name -->
              <!-- name의 값은 option의 value값 -->
              <select name="path" id="path">
                <option value="blog">블로그</option>
                <option value="search">검색</option>
                <option value="sns">SNS</option>
                <option value="etc">기타</option>
              </select>
            </li>
            <li>
              <label for="memo">메모</label>
              <textarea
                name="memo"
                id="memo"
                cols="40"
                rows="4"
                placeholder="남길 말씀을 적어주세요"
              ></textarea>
            </li>
          </ul>
        </fieldset>
        <!-- 이벤트 -->
        <fieldset>
          <legend>이벤트와 새로운 소식</legend>
          <input type="radio" name="mail" id="mail_y" value="yes" checked />
          <label for="mail_y">메일 수신</label>
          <input type="radio" name="mail" id="mail_n" value="no" />
          <label for="mail_n">메일 수신 안 함</label>
        </fieldset>
        <!-- 이동수단 -->
        <fieldset>
          <legend>이동수단</legend>
          <input type="checkbox" id="bus" name="bus" />
          <label for="bus">버스</label>
          <input type="checkbox" id="metro" name="metro" />
          <label for="metro">지하철</label>
          <input type="checkbox" id="walking" name="walking" checked />
          <label for="walking">도보</label>
        </fieldset>
        <div class="buttons">
          <input type="submit" value="가입하기" />
          <input type="reset" value="취소" />
        </div>
      </form>
    </div>
    
  </body>
</html>
