<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/input-test.css">
  </head>
  <body>
    <!-- action : 전송버튼을 눌렀을 때 데이터를 보낼 서버 위치 -->
    <!-- method : get(디폴트)-노출 / post:숨겨서보냄 -->
<!-- method="get" : 제출하면 주소창에 name=값 이 보여서 확인하기 좋음 -->
<form action="" method="get">

    <!-- 글자 수 제한 + 필수 + 자동 포커스 -->
    <label for="userId">아이디</label>
    <input type="text" id="userId" name="userId" class="text-input"
           placeholder="영문 4~12자" minlength="4" maxlength="12"
           required autofocus>

    <!-- 이메일 형식 자동 검사 -->
    <label for="email">이메일</label>
    <input type="email" id="email" name="email" class="text-input"
           placeholder="example@mail.com" required>

    <!-- pattern : 정규식 형식 검사 -->
    <label for="phone">휴대폰</label>
    <input type="tel" id="phone" name="phone" class="text-input"
           placeholder="010-1234-5678"
           pattern="010-[0-9]{4}-[0-9]{4}" required>

    <!-- number : min / max -->
    <label for="age">나이</label>
    <input type="number" id="age" name="age" class="text-input" min="1" max="120">

    <!-- number : min / max / step -->
    <label for="qty">수량 (2개 단위)</label>
    <input type="number" id="qty" name="qty" class="text-input"
           min="0" max="10" step="2" value="2">

    <!-- range : 슬라이더 -->
    <label for="volume">볼륨</label>
    <input type="range" id="volume" name="volume" min="0" max="100" step="10" value="50">

    <!-- date : 날짜 범위 -->
    <label for="reserve">예약일</label>
    <input type="date" id="reserve" name="reserve" class="text-input"
           min="2026-12-01" max="2026-12-31">

    <!-- radio : name이 같아야 한 그룹 -->
    <p>성별</p>
    <input type="radio" id="m" name="gender" value="M" checked>
    <label for="m">남</label>
    <input type="radio" id="f" name="gender" value="F">
    <label for="f">여</label>

    <!-- readonly : 수정 불가, 값 전송됨 -->
    <label for="code">가입 코드</label>
    <input type="text" id="code" name="code" class="text-input"
           value="A1234" readonly>

    <!-- disabled : 비활성화, 값 전송 안 됨 -->
    <label for="coupon">쿠폰 코드</label>
    <input type="text" id="coupon" name="coupon" class="text-input"
           value="EVENT2026" disabled>

    <!-- textarea : 여러 줄 입력 -->
    <label for="memo">자기소개</label>
    <textarea id="memo" name="memo" class="text-input" rows="5"
              placeholder="200자 이내" maxlength="200"></textarea>

    <button type="submit">가입</button>
</form>
  </body>
</html>
